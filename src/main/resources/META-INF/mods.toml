modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Piston auto-break bedrock client-side utility for Create mod.
Ported from NeoForge 1.21.1 to Forge 1.20.1.
'''

[[dependencies."${mod_id}"]]
    modId = "forge"
    type = "required"
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies."${mod_id}"]]
    modId = "create"
    type = "required"
    versionRange = "${create_version_range}"
    ordering = "AFTER"
    side = "BOTH"
