modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
随心所欲破基岩模组 - 活塞自动破基岩客户端工具
基于Create模组的扳手菜单功能，支持准星白名单、区域白名单、区域全部三种破方块模式。
从NeoForge 1.21.1移植到Forge 1.20.1。
'''

[[dependencies."${mod_id}"]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies."${mod_id}"]]
    modId = "create"
    mandatory = true
    versionRange = "${create_version_range}"
    ordering = "AFTER"
    side = "BOTH"
